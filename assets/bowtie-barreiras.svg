<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" class="bowtie-svg">
  <defs>
    <!-- ClipPaths de Proteção: Garantem 100% que nenhuma rachadura saia dos limites dos pilares -->
    <clipPath id="clip-p2"><rect x="320" y="100" width="46" height="250" rx="6" /></clipPath>
    <clipPath id="clip-p3"><rect x="400" y="130" width="46" height="190" rx="6" /></clipPath>
    <clipPath id="clip-p4"><rect x="480" y="160" width="46" height="130" rx="6" /></clipPath>
    <clipPath id="clip-m1"><rect x="674" y="160" width="46" height="130" rx="6" /></clipPath>
    <clipPath id="clip-m2"><rect x="754" y="130" width="46" height="190" rx="6" /></clipPath>
    <clipPath id="clip-m3"><rect x="834" y="100" width="46" height="250" rx="6" /></clipPath>
    <clipPath id="clip-m4"><rect x="914" y="70" width="46" height="310" rx="6" /></clipPath>

    <!-- Marcador de Seta Cinza Executivo -->
    <marker id="arrow-exec-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Marcador de Seta Vermelho Executivo -->
    <marker id="arrow-exec-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <style>
    .bowtie-svg {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      background-color: #ffffff;
    }

    /* Tipografia Executiva de Rótulos Superiores e Laterais */
    .exec-header {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: #475569;
    }

    .exec-header-danger {
      fill: #dc2626;
    }

    .exec-side-label {
      font-size: 12px;
      font-weight: 800;
      fill: #475569;
      letter-spacing: 0.04em;
    }

    /* Círculos das Pontas em Estilo Minimalista de Alta Precisão */
    .exec-node-circle {
      fill: #ffffff;
      stroke: #64748b;
      stroke-width: 1.5;
      transition: all 0.3s ease;
    }

    .exec-node-text {
      font-size: 11px;
      font-weight: 600;
      fill: #1e293b;
    }

    /* Linhas de Fluxo Técnicas */
    .exec-flow-line {
      stroke: #94a3b8;
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      fill: none;
      marker-end: url(#arrow-exec-gray);
      transition: all 0.3s ease;
    }

    .exec-flow-line-red {
      stroke: #dc2626;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      fill: none;
      marker-end: url(#arrow-exec-red);
      transition: all 0.3s ease;
    }

    /* Grupo de Barreiras Executivas */
    .exec-barrier-group {
      cursor: pointer;
      outline: none;
    }

    .exec-barrier-rect {
      fill: #ffffff;
      stroke: #1e293b;
      stroke-width: 1.8;
      rx: 6px;
      transition: all 0.35s ease;
    }

    .exec-barrier-badge {
      font-size: 11px;
      font-weight: 900;
      fill: #1e293b;
      text-anchor: middle;
      transition: all 0.35s ease;
    }

    /* Chips Horizontais Legíveis para os Títulos das Barreiras */
    .exec-title-chip-bg {
      fill: #f8fafc;
      stroke: #e2e8f0;
      stroke-width: 1;
      rx: 12px;
      transition: all 0.35s ease;
    }

    .exec-title-chip-text {
      font-size: 10px;
      font-weight: 700;
      fill: #334155;
      text-anchor: middle;
      transition: all 0.35s ease;
    }

    /* Círculo Duplo Técnico de Evento Crítico */
    .exec-event-ring {
      fill: none;
      stroke: #dc2626;
      stroke-width: 1.5;
      stroke-dasharray: 4 2;
      transition: all 0.35s ease;
    }

    .exec-event-circle {
      fill: #fef2f2;
      stroke: #dc2626;
      stroke-width: 2;
      transition: all 0.35s ease;
    }

    .exec-event-text {
      font-size: 11px;
      font-weight: 900;
      fill: #991b1b;
      text-anchor: middle;
      letter-spacing: 0.04em;
    }

    .exec-event-sub {
      font-size: 9px;
      font-weight: 600;
      fill: #dc2626;
      text-anchor: middle;
    }

    /* Fissuras/Rachaduras Finas 100% Contidas nos Pilares */
    .exec-crack-line {
      stroke: #dc2626;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.75;
      transition: stroke 0.35s ease, stroke-width 0.35s ease, opacity 0.35s ease, filter 0.35s ease;
    }

    /* ═════════════════════════════════════════════════════════════════ */
    /* HOVER / FOCUS: ILUMINAÇÃO NEON DAS RACHADURAS                      */
    /* ═════════════════════════════════════════════════════════════════ */

    .exec-barrier-group:hover .exec-crack-line,
    .exec-barrier-group:focus .exec-crack-line,
    .exec-barrier-group.active-highlight .exec-crack-line {
      stroke: #fc413d !important;
      stroke-width: 3px !important;
      opacity: 1 !important;
      filter: drop-shadow(0 0 6px rgba(252, 65, 61, 0.9));
      animation: pulseCrackExec 1.6s infinite alternate ease-in-out;
    }

    @keyframes pulseCrackExec {
      0% { stroke: #fc413d; filter: drop-shadow(0 0 3px rgba(252, 65, 61, 0.7)); }
      100% { stroke: #ff1a15; filter: drop-shadow(0 0 9px rgba(252, 65, 61, 1)); }
    }

    .exec-barrier-group:hover .exec-barrier-rect,
    .exec-barrier-group:focus .exec-barrier-rect,
    .exec-barrier-group.active-highlight .exec-barrier-rect {
      stroke: #fc413d;
      stroke-width: 2.2;
      fill: #fff5f5;
    }

    .exec-barrier-group:hover .exec-barrier-badge,
    .exec-barrier-group:focus .exec-barrier-badge,
    .exec-barrier-group.active-highlight .exec-barrier-badge {
      fill: #fc413d;
    }

    .exec-barrier-group:hover .exec-title-chip-bg,
    .exec-barrier-group:focus .exec-title-chip-bg,
    .exec-barrier-group.active-highlight .exec-title-chip-bg {
      fill: #fee2e2;
      stroke: #fc413d;
    }

    .exec-barrier-group:hover .exec-title-chip-text,
    .exec-barrier-group:focus .exec-title-chip-text,
    .exec-barrier-group.active-highlight .exec-title-chip-text {
      fill: #991b1b;
    }
  </style>

  <!-- ── RÓTULOS SUPERIORES ── -->
  <text x="90" y="32" class="exec-header" text-anchor="middle">Causas Iniciais</text>
  <text x="400" y="32" class="exec-header" text-anchor="middle">Barreiras Preventivas</text>
  <text x="600" y="32" class="exec-header exec-header-danger" text-anchor="middle">Evento Crítico</text>
  <text x="800" y="32" class="exec-header" text-anchor="middle">Barreiras Mitigadoras</text>
  <text x="1110" y="32" class="exec-header" text-anchor="middle">Impactos</text>

  <!-- ── RÓTULOS LATERAIS ── -->
  <text x="24" y="225" class="exec-side-label" text-anchor="middle">Ameaças</text>
  <text x="1176" y="225" class="exec-side-label" text-anchor="middle">Consequências</text>

  <!-- ── ESQUERDA: 5 CÍRCULOS AMEAÇAS ── -->
  <circle cx="90" cy="85" r="16" class="exec-node-circle" />
  <circle cx="90" cy="152" r="16" class="exec-node-circle" />
  <circle cx="90" cy="220" r="16" class="exec-node-circle" />
  <circle cx="90" cy="288" r="16" class="exec-node-circle" />
  <circle cx="90" cy="355" r="16" class="exec-node-circle" />

  <!-- SETAS DE FLUXO ESQUERDA -->
  <path d="M 106,85 L 240,85" class="exec-flow-line" />
  <path d="M 106,152 L 240,152" class="exec-flow-line" />
  <path d="M 106,220 L 240,220" class="exec-flow-line" />
  <path d="M 106,288 L 240,288" class="exec-flow-line" />
  <path d="M 106,355 L 240,355" class="exec-flow-line" />

  <!-- ── BARREIRAS PREVENTIVAS EXECUTIVAS (4 PILARES P1-P4) ── -->
  <!-- Pilar P1 (Mais Alto - Intacto) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Preventiva P1" data-barrier="p1">
    <text x="263" y="58" class="exec-barrier-badge">P1</text>
    <rect x="240" y="70" width="46" height="310" class="exec-barrier-rect" />
    <g transform="translate(263, 400)">
      <rect x="-54" y="0" width="108" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Inspeção Preditiva</text>
    </g>
  </g>

  <path d="M 286,220 L 320,220" class="exec-flow-line" />

  <!-- Pilar P2 (Com Trinca 100% Contida) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Preventiva P2" data-barrier="p2">
    <text x="343" y="88" class="exec-barrier-badge">P2</text>
    <rect x="320" y="100" width="46" height="250" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-p2)" d="M 324,155 Q 338,172 344,192 T 332,218 T 358,242 T 344,268 T 362,288" />
    <g transform="translate(343, 370)">
      <rect x="-56" y="0" width="112" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Intertrava &amp; Alarme</text>
    </g>
  </g>

  <path d="M 366,220 L 400,220" class="exec-flow-line" />

  <!-- Pilar P3 (Com Trinca 100% Contida) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Preventiva P3" data-barrier="p3">
    <text x="423" y="118" class="exec-barrier-badge">P3</text>
    <rect x="400" y="130" width="46" height="190" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-p3)" d="M 404,170 Q 418,190 426,210 T 412,235 T 438,258 T 426,280" />
    <g transform="translate(423, 340)">
      <rect x="-44" y="0" width="88" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Procedimento</text>
    </g>
  </g>

  <path d="M 446,220 L 480,220" class="exec-flow-line" />

  <!-- Pilar P4 (Mais Curto) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Preventiva P4" data-barrier="p3">
    <text x="503" y="148" class="exec-barrier-badge">P4</text>
    <rect x="480" y="160" width="46" height="130" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-p4)" d="M 484,185 Q 496,200 504,218 T 494,240 T 518,260" />
    <g transform="translate(503, 310)">
      <rect x="-36" y="0" width="72" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Controle</text>
    </g>
  </g>

  <path d="M 526,220 L 556,220" class="exec-flow-line-red" />

  <!-- ── CENTRO: EVENTO CRÍTICO (CÍRCULO DUPLO TÉCNICO DE ALTA PRECISÃO) ── -->
  <g class="exec-event-group" tabindex="0" role="button" aria-label="Evento Crítico Central" data-barrier="event">
    <circle cx="600" cy="220" r="44" class="exec-event-ring" />
    <circle cx="600" cy="220" r="38" class="exec-event-circle" />
    <text x="600" y="210" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="900">⚠</text>
    <text x="600" y="225" class="exec-event-text">EVENTO CRÍTICO</text>
    <text x="600" y="237" class="exec-event-sub">(Perda de Controle)</text>
  </g>

  <path d="M 644,220 L 674,220" class="exec-flow-line-red" />

  <!-- ── BARREIRAS MITIGADORAS EXECUTIVAS (4 PILARES M1-M4) ── -->
  <!-- Pilar M1 (Mais Curto) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Mitigadora M1" data-barrier="m1">
    <text x="697" y="148" class="exec-barrier-badge">M1</text>
    <rect x="674" y="160" width="46" height="130" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-m1)" d="M 678,195 Q 690,210 698,230 T 712,255" />
    <g transform="translate(697, 310)">
      <rect x="-48" y="0" width="96" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Válvula de Alívio</text>
    </g>
  </g>

  <path d="M 720,220 L 754,220" class="exec-flow-line" />

  <!-- Pilar M2 (Com Trinca) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Mitigadora M2" data-barrier="m2">
    <text x="777" y="118" class="exec-barrier-badge">M2</text>
    <rect x="754" y="130" width="46" height="190" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-m2)" d="M 758,210 Q 772,230 L 780,250 T 794,275" />
    <g transform="translate(777, 340)">
      <rect x="-42" y="0" width="84" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Emergência</text>
    </g>
  </g>

  <path d="M 800,220 L 834,220" class="exec-flow-line" />

  <!-- Pilar M3 (Com Trinca de Base) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Mitigadora M3" data-barrier="m3">
    <text x="857" y="88" class="exec-barrier-badge">M3</text>
    <rect x="834" y="100" width="46" height="250" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-m3)" d="M 838,235 Q 852,258 860,280 T 874,305" />
    <g transform="translate(857, 370)">
      <rect x="-40" y="0" width="80" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Contenção</text>
    </g>
  </g>

  <path d="M 880,220 L 914,220" class="exec-flow-line" />

  <!-- Pilar M4 (Mais Alto) -->
  <g class="exec-barrier-group" tabindex="0" role="button" aria-label="Barreira Mitigadora M4" data-barrier="m3">
    <text x="937" y="58" class="exec-barrier-badge">M4</text>
    <rect x="914" y="70" width="46" height="310" class="exec-barrier-rect" />
    <path class="exec-crack-line" clip-path="url(#clip-m4)" d="M 918,255 Q 932,280 940,305 T 930,332 T 952,358" />
    <g transform="translate(937, 400)">
      <rect x="-52" y="0" width="104" height="22" class="exec-title-chip-bg" />
      <text x="0" y="14" class="exec-title-chip-text">Isolamento &amp; EPI</text>
    </g>
  </g>

  <!-- DIREITA: 5 CÍRCULOS CONSEQUÊNCIAS -->
  <path d="M 960,85 L 1094,85" class="exec-flow-line" />
  <path d="M 960,152 L 1094,152" class="exec-flow-line" />
  <path d="M 960,220 L 1094,220" class="exec-flow-line" />
  <path d="M 960,288 L 1094,288" class="exec-flow-line" />
  <path d="M 960,355 L 1094,355" class="exec-flow-line" />

  <circle cx="1110" cy="85" r="16" class="exec-node-circle" />
  <circle cx="1110" cy="152" r="16" class="exec-node-circle" />
  <circle cx="1110" cy="220" r="16" class="exec-node-circle" />
  <circle cx="1110" cy="288" r="16" class="exec-node-circle" />
  <circle cx="1110" cy="355" r="16" class="exec-node-circle" />
</svg>
