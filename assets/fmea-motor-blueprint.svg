<svg class="motor-blueprint-svg" viewBox="0 0 640 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes Técnicos Blueprint -->
    <linearGradient id="bp-shaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bp-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bp-stator" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bp-rotor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bp-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <pattern id="bp-grid-pat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="0.75"/>
    </pattern>
    <filter id="bp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Grade Blueprint -->
  <rect width="640" height="480" fill="url(#bp-grid-pat)" />

  <!-- Linha Central de Eixo (Centerline Técnica) -->
  <line x1="30" y1="240" x2="610" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="12 4 3 4" stroke-opacity="0.5"/>

  <!-- ================= CARCAÇA / ALETAS DE RESFRIAMENTO ================= -->
  <!-- Aletas Superiores -->
  <path d="M 180 100 L 460 100 L 460 80 L 180 80 Z" fill="url(#bp-frame)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
  <path d="M 200 80 L 200 65 M 230 80 L 230 65 M 260 80 L 260 65 M 290 80 L 290 65 M 320 80 L 320 65 M 350 80 L 350 65 M 380 80 L 380 65 M 410 80 L 410 65 M 440 80 L 440 65" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Caixa de Ligação Elétrica Superior (Terminal Box) -->
  <rect x="280" y="32" width="95" height="38" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="290" y="38" width="75" height="8" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
  <circle cx="360" cy="51" r="5" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
  <text x="327" y="62" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle" font-weight="700">TERMINAL BOX</text>

  <!-- Corpo Principal da Carcaça em Corte (Metade Superior e Inferior) -->
  <rect x="175" y="80" width="290" height="320" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9"/>

  <!-- Pés de Fixação / Base (Mounting Feet) -->
  <path d="M 190 400 L 170 435 L 240 435 L 230 400 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="205" cy="422" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <path d="M 405 400 L 395 435 L 465 435 L 445 400 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="430" cy="422" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="150" y1="435" x2="490" y2="435" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Flange / Tampa Dianteira (Drive End Shield) -->
  <path d="M 175 110 L 135 150 L 135 330 L 175 370 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Tampa Traseira e Defletor da Ventoinha (Non-Drive End) -->
  <path d="M 465 110 L 500 140 L 500 340 L 465 370 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Ventoinha de Refrigeração (Fan) -->
  <path d="M 505 130 Q 550 120 550 240 Q 550 360 505 350 Z" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2"/>
  <line x1="515" y1="160" x2="540" y2="180" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="515" y1="210" x2="545" y2="220" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="515" y1="270" x2="545" y2="260" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="515" y1="320" x2="540" y2="300" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- ================= ESTATOR (STATOR CORE & COPPER WINDINGS) ================= -->
  <!-- Núcleo Laminado do Estator (Superior) -->
  <rect x="210" y="100" width="220" height="42" fill="url(#bp-stator)" stroke="#0284c7" stroke-width="1.2"/>
  <!-- Ranhuras do Estator -->
  <path d="M 230 100 L 230 142 M 250 100 L 250 142 M 270 100 L 270 142 M 290 100 L 290 142 M 310 100 L 310 142 M 330 100 L 330 142 M 350 100 L 350 142 M 370 100 L 370 142 M 390 100 L 390 142 M 410 100 L 410 142" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Cabeças de Bobina de Cobre (Winding Coils Superior) -->
  <rect x="185" y="112" width="25" height="34" rx="4" fill="url(#bp-copper)" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="430" y="112" width="25" height="34" rx="4" fill="url(#bp-copper)" stroke="#ea580c" stroke-width="1.2"/>
  <path d="M 210 142 C 210 152 430 152 430 142" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Núcleo Laminado do Estator (Inferior) -->
  <rect x="210" y="338" width="220" height="42" fill="url(#bp-stator)" stroke="#0284c7" stroke-width="1.2"/>
  <!-- Ranhuras do Estator Inferior -->
  <path d="M 230 338 L 230 380 M 250 338 L 250 380 M 270 338 L 270 380 M 290 338 L 290 380 M 310 338 L 310 380 M 330 338 L 330 380 M 350 338 L 350 380 M 370 338 L 370 380 M 390 338 L 390 380 M 410 338 L 410 380" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- Cabeças de Bobina Inferior -->
  <rect x="185" y="334" width="25" height="34" rx="4" fill="url(#bp-copper)" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="430" y="334" width="25" height="34" rx="4" fill="url(#bp-copper)" stroke="#ea580c" stroke-width="1.2"/>

  <!-- ================= ENTREFERRO (AIR GAP) ================= -->
  <line x1="210" y1="152" x2="430" y2="152" stroke="#ef4444" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.8"/>
  <line x1="210" y1="328" x2="430" y2="328" stroke="#ef4444" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.8"/>

  <!-- ================= ROTOR (ROTOR CORE & BARS) ================= -->
  <!-- Pacote de Lâminas do Rotor -->
  <rect x="220" y="156" width="200" height="168" rx="2" fill="url(#bp-rotor)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Barras da Gaiola Inclinadas (Skewed Rotor Bars) -->
  <line x1="240" y1="156" x2="252" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="270" y1="156" x2="282" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="300" y1="156" x2="312" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="330" y1="156" x2="342" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="360" y1="156" x2="372" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <line x1="390" y1="156" x2="402" y2="324" stroke="#e0f2fe" stroke-width="1.8" stroke-opacity="0.8"/>
  <!-- Anéis de Curto-Circuito (Short-Circuit End Rings) -->
  <rect x="212" y="160" width="10" height="160" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <rect x="418" y="160" width="10" height="160" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

  <!-- ================= EIXO (MAIN SHAFT) ================= -->
  <!-- Ponta do Eixo com Chaveta (Drive Shaft Output) -->
  <rect x="40" y="222" width="100" height="36" rx="2" fill="url(#bp-shaft)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Rasgo de Chaveta -->
  <rect x="55" y="228" width="45" height="8" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Corpo Central do Eixo -->
  <rect x="140" y="220" width="370" height="40" fill="url(#bp-shaft)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- ================= ROLAMENTOS DE ESFERAS (BEARINGS) ================= -->
  <!-- Rolamento Dianteiro (Drive End Bearing 6309) -->
  <g id="svg-front-bearing">
    <!-- Pista Externa -->
    <rect x="142" y="195" width="30" height="90" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Pista Interna -->
    <rect x="147" y="210" width="20" height="60" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Esferas de Aço (Ball Bearings) -->
    <circle cx="157" cy="204" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <circle cx="157" cy="276" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Rolamento Traseiro (Non-Drive End Bearing) -->
  <g id="svg-rear-bearing">
    <rect x="472" y="202" width="24" height="76" fill="#1e293b" stroke="#f8fafc" stroke-width="1.2"/>
    <circle cx="484" cy="210" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <circle cx="484" cy="270" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- ================= COTAS E ANOTAÇÕES TÉCNICAS BLUEPRINT ================= -->
  <!-- Linha de Cota Eixo -->
  <line x1="40" y1="275" x2="140" y2="275" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="40" y1="270" x2="40" y2="280" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="140" y1="270" x2="140" y2="280" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="90" y="287" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">Ø 48 mm (h6)</text>

  <!-- Rótulos Blueprint de Engenharia -->
  <g font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8" opacity="0.85">
    <text x="320" y="118" text-anchor="middle">ESTATOR [ ISOLAMENTO CLASSE H ]</text>
    <text x="320" y="244" text-anchor="middle" fill="#0f172a" font-weight="900">ROTOR DE GAIOLA</text>
    <text x="157" y="304" text-anchor="middle" font-size="7.5" fill="#f8fafc">MANCAL D.E.</text>
    <text x="535" y="375" text-anchor="middle" font-size="7.5" fill="#94a3b8">VENTOINHA IC411</text>
  </g>

  <!-- Crosshairs de Precisão nos Cantos -->
  <path d="M 20 20 L 35 20 M 20 20 L 20 35" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 620 20 L 605 20 M 620 20 L 620 35" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 20 460 L 35 460 M 20 460 L 20 445" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 620 460 L 605 460 M 620 460 L 620 445" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>