ng:10px 16px;line-height:1.5;font-size:14px;margin:22px 0}.nav-topic,.audit-item,.check-group{border-top:2px solid #000;padding:18px 0}.nav-slides{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav-slides button{text-align:left;border:1px solid #000;padding:12px;font-size:15px}.nav-slides button[aria-current]{outline:2px solid #000;outline-offset:1px}.check-row{display:grid;grid-template-columns:2fr 1fr 2fr;gap:16px;border-bottom:1px solid #000;padding:14px 0}.audit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.audit-head h3{margin-top:0}.audit-item textarea{min-height:65px}.audit-warn{font-size:13px;font-weight:bold}svg{display:block;width:100%;max-width:950px}svg text{fill:#000;font-family:Arial,Helvetica,sans-serif}.start{position:fixed;inset:0;background:#fff;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.start[hidden]{display:none}.start-inner{max-width:1000px;width:100%}.start h1{font-size:clamp(42px,6vw,80px)}.start .lead{max-width:850px}.start-meta{display:flex;gap:30px;font-size:14px;border-top:1px solid #000;padding-top:20px;margin-top:35px}

<script>
"use strict";
const topics=[{"title":"Por que utilizar o LCC?","minutes":25,"times":[3,3,3,3,4,3,3,3],"slides":[["Qual você compraria?","O preço isolado não resolve a decisão.",["Qual você aprovaria?"],"Apresente as duas propostas fictícias. Ambas atendem à vazão e à pressão requeridas, mas ainda não sabemos se todos os demais requisitos foram verificados. Faça uma votação e ouça justificativas sem indicar uma vencedora. Não revele consumo, manutenção ou vida útil.","Quem escolheria A? Quem escolheria B?","O que precisamos saber antes de aprovar?","purchase"],["O que falta saber?","Precisamos conhecer uso e custos futuros.",["Quanto consome?","Quanto falha?","Quanto custa manter?","Quanto tempo será utilizada?"],"Antes de revelar as perguntas, peça sugestões à turma. Relacione as respostas a informações dos fornecedores, da manutenção e da operação. Consumo e falhas dependem da aplicação. A intensidade de uso pode mudar a preferência.","Qual informação mais poderia mudar sua decisão?","A compra é apenas o começo.","cards"],["A compra é apenas o começo.","O desembolso continua depois da compra.",["Concepção","Aquisição","Instalação","Operação e manutenção","Descomissionamento"],"Percorra a trajetória da bomba desde a necessidade até sua retirada. Cite projeto, instalação, energia, peças, intervenções e destinação. Apresente as categorias sem detalhar os custos. A análise de uma decisão atual distingue custos futuros dos já incorridos.","Em qual etapa sua área participa? Em qual deveria participar?","Precisamos organizar esses custos.","timeline"],["É isso que o LCC organiza.","O LCC amplia a perspectiva da decisão.",["LCC — Life Cycle Cost","Custo do ciclo de vida","Avaliar os custos das alternativas ao longo da vida do ativo."],"Dê nome ao raciocínio construído. Compare alternativas que atendam à mesma necessidade, com premissas coerentes e horizonte definido. O momento dos custos importa. Não apresente cálculos: a estruturação e o desconto serão aprofundados depois.","O que poderia distorcer essa comparação?","A ordem das propostas pode mudar.","definition"],["O menor preço leva ao menor custo?","A diferença inicial pode se inverter.",["Aquisição","Custos posteriores","A diferença inicial pode se inverter."],"Apresente uma hipótese: A consome mais energia e exige mais intervenções. O gráfico é conceitual, sem escala; não representa resultado calculado. B precisa justificar seu investimento adicional. Não revele o gabarito do curso.","O que precisaria acontecer para A continuar sendo melhor?","Parte desses custos nasce antes da operação.","concept"],["O custo nasce antes da falha.","Decisões de projeto influenciam custos futuros.",["Especificação","Eficiência","Acesso para manutenção"],"Relacione seleção inadequada a consumo e problemas operacionais. Acesso difícil aumenta tempo de intervenção; componentes influenciam peças e suporte. Mostre por que manutenção e operação devem participar da especificação.","Qual problema da sua manutenção poderia ter sido evitado no projeto?","O raciocínio também vale para ativos existentes.","cards"],["Que decisões o LCC apoia?","O LCC apoia decisões durante a vida do ativo.",["Manter","Modernizar","Substituir"],"Avance hipoteticamente na história: imagine que a bomba já opera há alguns anos. Discuta continuidade, modernização e substituição. Todas as alternativas devem atender aos requisitos de segurança, desempenho e conformidade. Menor custo não compensa requisito obrigatório descumprido.","Qual dessas decisões está em discussão na sua empresa?","Antes de comparar, precisamos definir a análise.","cards"],["Antes de calcular, precisamos definir.","Uma comparação válida exige uma base definida.",["Para qual necessidade?","Por quantos anos?","Sob quais condições?"],"Retorne ao momento inicial da compra. Peça à turma que reformule a pergunta considerando condições de uso e horizonte. Não escolha A ou B. A evolução pretendida é sair da comparação de preços para uma decisão estruturada.","Como vocês formulariam agora a pergunta da análise?","Vamos estruturar essa comparação.","cards"]]},{"title":"Como estruturar a análise?","minutes":30,"times":[3,4,4,4,4,4,4,3],"slides":[["Qual decisão precisamos tomar?","A análise começa pela decisão.",["Selecionar uma bomba para atender à necessidade da operação."],"Formule o problema. Selecionar equipamento, ampliar capacidade e substituir um ativo são decisões diferentes. Elas podem exigir alternativas e fronteiras distintas. Neste caso, mantenha o foco na seleção entre A e B.","Estamos escolhendo uma bomba ou ainda definindo como atender à necessidade?","Precisamos descrever o serviço esperado.","decision"],["Primeiro, a necessidade.","A necessidade define a entrega.",["Qual vazão?","Qual pressão?","Qual regime?","Quais condições?"],"Comprar a bomba é a solução; movimentar o fluido nas condições requeridas é a necessidade. Explore fluido, variação de demanda e ambiente. Não invente especificações ausentes. Atender ao ponto nominal não garante desempenho em todos os regimes.","Atender ao ponto nominal garante bom desempenho em todo o regime?","Agora precisamos definir os requisitos.","cards"],["O que é obrigatório atender?","Requisitos delimitam alternativas admissíveis.",["Desempenho","Segurança e conformidade","Compatibilidade","Manutenção e suporte"],"Diferencie obrigação de preferência. Materiais, características elétricas, espaço e suporte mínimo podem ser requisitos. Vazão e pressão atendidas não equivalem à aprovação de todos os critérios. Registre a evidência da verificação.","O que eliminaria uma proposta?","Quais soluções podem entrar na comparação?","cards"],["Duas propostas, a mesma entrega?","Comparar soluções completas.",["A: solução completa?","B: solução completa?","Mesmo serviço requerido."],"Verifique motor, acionamento, testes e acessórios. Uma alternativa pode exigir adequações externas. Soluções diferentes são comparáveis quando atendem ao mesmo serviço e os custos complementares são reconhecidos.","O que pode estar faltando em uma proposta?","Precisamos estabelecer as fronteiras.","cards"],["Onde a análise começa e termina?","Inclusões e exclusões precisam ser explícitas.",["Bomba","Conjunto de bombeamento","Sistema e interfaces"],"Use a hipótese de adequação elétrica exigida por uma alternativa. Defina abrangência física, etapas e consequências. Custos já incorridos e irrecuperáveis não mudam com a decisão futura. Documente simplificações de custos comuns.","Qual custo fora da proposta seria provocado pela escolha?","Também precisamos definir o período.","boundaries"],["Por quantos anos?","Horizonte e vida útil não são sinônimos.",["Horizonte da análise ≠ vida útil","Mesmo período de comparação."],"O horizonte é escolhido para a decisão. A vida útil depende do ativo e das condições. Substituições intermediárias e residual precisam de tratamento coerente. O caso adota oito anos como hipótese, não como vida útil universal de bombas.","É válido comparar períodos diferentes sem tratamento?","Agora registramos as premissas.","horizon"],["Dado ou premissa?","Toda estimativa precisa de origem.",["Informação","Fonte","Responsável","Data"],"Diferencie histórico observado, informação de fornecedor e hipótese. Registre limites de validade e incerteza. Uma estimativa pode ser útil sem ser certeza. Abra o registro de premissas nos materiais, se necessário.","Qual dado merece maior verificação?","Vamos consolidar a base da análise.","cards"],["A análise está definida?","Estrutura definida não significa dados completos.",["Decisão e necessidade","Requisitos e alternativas","Fronteiras e horizonte","Premissas e fontes"],"Uma ficha organizada ainda pode ter pendências, que precisam de responsáveis. Não marque desconhecidos como confirmados. O objetivo é tornar a comparação compreensível e reproduzível.","Outra pessoa conseguiria reproduzir a comparação?","Agora vamos identificar os custos.","cards"]]},{"title":"Quais custos considerar?","minutes":35,"times":[3,4,4,5,5,5,5,4],"slides":[["O que ainda não está na proposta?","O preço comercial pode não conter todos os custos.",["Comprar","Colocar em operação","Manter funcionando","Encerrar"],"Retome as fronteiras e identifique quem arca com cada item. Propostas podem omitir instalação, interfaces e despesas futuras. Não acrescente tudo indiscriminadamente: avalie pertinência e diferenças.","O que costuma aparecer somente depois da aprovação?","Comecemos pelos custos iniciais.","cards"],["Quanto custa colocar para funcionar?","Investimento inicial é maior que o preço da bomba.",["Aquisição + engenharia + logística + instalação + comissionamento"],"Abra os adicionais originais: engenharia R$ 5 mil, logística R$ 3 mil, instalação R$ 8 mil e comissionamento R$ 4 mil em cada alternativa. São hipóteses. Custos comuns precisam ser identificados, ainda que não alterem a diferença.","Qual item costuma ficar fora do orçamento inicial?","Depois da partida, começam os custos recorrentes.","initial"],["O que se repete todos os anos?","Custos recorrentes podem ser relevantes no horizonte.",["Energia","Operação","Manutenção","Consequências das falhas"],"Separe recorrente, eventual e terminal. Apresente 6.000 horas efetivas anuais. Alguns custos dependem do uso; outros, do calendário. No exercício, planejada e outros custos operacionais são parcelas anuais fixas.","Quais custos variam com uso e quais seguem o calendário?","Vamos calcular um dos principais componentes.","cards"],["Quanto custa a energia?","Consumo depende de potência, tempo e tarifa.",["C_energia = P × H × Tarifa"],"Use 30 e 25 kW de potência elétrica absorvida, 6.000 h e R$ 0,80/kWh. Não divida novamente por eficiência. No caso não há aumento real de tarifa. Sistemas reais podem exigir perfil de carga e condições tarifárias mais detalhadas.","O que muda se a bomba operar poucas horas?","Energia não é o único custo de uso.","energy"],["Quanto custa manter?","Manutenção planejada e corretiva compõem o custo de manutenção.",["Planejada","Corretiva"],"Organize a manutenção em duas categorias. A planejada inclui rotinas anuais de R$ 6 mil para A e R$ 4 mil para B, mais uma intervenção prevista no ano 4 de R$ 12 mil e R$ 8 mil. Essa intervenção é uma parcela da planejada e não está incluída nas rotinas anuais. A corretiva depende da frequência esperada de falhas e do custo por reparo. Some cada desembolso apenas uma vez, no ano correspondente.","A intervenção prevista já está incluída no orçamento anual da planejada?","Também precisamos olhar para o fim do período.","maintenance"],["O fim da vida também tem valor.","Encerramento pode gerar custos e créditos.",["Retirar","Destinar","Recuperar valor"],"Descomissionamento original de R$ 10 mil em cada alternativa; residual de R$ 5 mil e R$ 8 mil. O residual é estimado, não garantido. Evite deduzir o mesmo crédito em mais de uma parcela.","O valor residual está documentado ou apenas suposto?","Agora verificamos o que pode estar faltando.","terminal"],["O que pode ficar invisível?","Custos indiretos e consequências exigem análise de pertinência.",["Interfaces","Treinamento","Sobressalentes","Perdas e obrigações"],"Discuta estoques, obsolescência, contratos, obrigações ambientais e indisponibilidade. Diferencie incluído, excluído com justificativa e pendente. O exercício não modela todos os impactos possíveis: isso não significa que sejam sempre nulos.","Qual item seria relevante na sua planta e não está neste caso?","Antes de somar, precisamos eliminar sobreposições.","cards"],["Cada custo tem um lugar.","A estrutura deve impedir dupla contagem.",["Descrição","Categoria e momento","Fonte","Já está incluído?"],"Revise pacote e componentes; rotinas anuais e intervenção prevista dentro da manutenção planejada; reparo e consequência produtiva. Cada linha precisa de unidade, recorrência e fonte. Abra a estrutura de custos nos materiais.","Conseguimos rastrear cada parcela até sua origem?","Agora vamos estimar as consequências das falhas.","cards"]]},{"title":"Como a confiabilidade influencia os custos?","minutes":25,"times":[3,3,3,4,3,3,3,3],"slides":[["Falhar custa mais que reparar?","Uma falha pode gerar custos diretos e consequências.",["Reparo","Interrupção","Consequência"],"Diferencie desembolso de reparo e oportunidade econômica perdida. Nem toda parada impede produção. Antes de monetizar, entenda o sistema, a redundância e a possibilidade de recuperar produção.","Na sua operação, o maior impacto está onde?","Primeiro estimamos quantas falhas podem ocorrer.","cards"],["Quantas falhas esperar?","Frequência esperada não é previsão exata de eventos.",["N_falhas ≈ H / MTBF"],"Use MTBF de 6.000 h para A e 12.000 h para B. O modelo supõe taxa estável. Uma expectativa de 0,5 evento/ano não é meia falha física. Envelhecimento ou mudanças de regime podem exigir outro modelo.","O que mudaria se a taxa de falhas aumentasse com a idade?","Frequência e duração precisam ser separadas.","failures"],["Quanto tempo ficamos indisponíveis?","A duração da interrupção influencia o resultado.",["H_indisponibilidade = N_falhas × D"],"D é a duração total considerada: 8 h em A e 6 h em B por falha. Diferencie reparo ativo e restauração total. Se logística e reinício já estão incluídos, não os some novamente.","Qual parcela do tempo é reparo e qual é espera?","Vamos calcular primeiro o custo direto.","downtime"],["Quanto custa o reparo?","O custo direto depende da frequência e do custo por evento.",["C_corretivo = N_falhas × Custo_por_falha"],"Use R$ 4 mil por evento em ambas. O valor inclui recursos diretos e não contém perda produtiva. Verifique se a base é histórica, estimada ou fornecida pelo fabricante.","O custo por evento veio de histórico ou estimativa?","Agora avaliamos a consequência operacional.","corrective"],["Parada não é sinônimo de perda.","A consequência depende do sistema.",["Há reserva?","Há estoque?","É gargalo?","A produção será recuperada?"],"No original, não há reserva e a perda não será recuperada. Isso é hipótese. Uma reserva tem custo e pode não cobrir todos os eventos. Estoques intermediários e capacidade ociosa podem modificar a consequência.","Uma hora parada representa uma hora perdida de produção?","Quando há perda, precisamos valorizá-la corretamente.","cards"],["Qual é a perda econômica?","Usar perda líquida relevante, não faturamento bruto.",["C_perda = H_indisponibilidade × Perda_líquida/h"],"Adote R$ 1.000/h de contribuição líquida não recuperável. Não use faturamento bruto. Separe oportunidade perdida dos desembolsos. Custos variáveis evitados precisam de tratamento coerente.","Quem valida esse valor por hora na empresa?","Além da média, precisamos entender a evidência.","loss"],["Uma média não conta toda a história.","Dados e modelos têm limites.",["Aplicação","Histórico","Dispersão","Envelhecimento"],"MTBF não é vida útil. Verifique representatividade e contexto. Eventos raros graves exigem tratamento próprio de risco: baixo valor esperado não os torna automaticamente aceitáveis.","Esses dados representam nossa aplicação?","Vamos consolidar as parcelas anuais.","cards"],["A confiabilidade entrou na conta.","O custo anual reúne operação, manutenção e consequências.",["Mesmo caso. Mais informações."],"Revise energia, operação, planejada, corretiva e perdas. Ainda não use soma simples como conclusão econômica: os custos ocorrem em momentos diferentes. Faça o intervalo antes do tópico 5.","Basta multiplicar pelo número de anos?","Após o intervalo, colocaremos os custos na mesma data.","annual"]]},{"title":"Como comparar economicamente as alternativas?","minutes":35,"times":[4,4,5,5,4,5,4,4],"slides":[["Em que momento cada custo ocorre?","O momento do custo importa.",["Hoje","Anualmente","Ano da intervenção","Fim do horizonte"],"Posicione investimento em t=0, anuais no fim de cada ano, intervenção no ano 4 e encerramento no ano 8. Separe custos diretos e perdas de oportunidade. O fluxo econômico não equivale apenas a desembolsos.","Qual parcela ocorre uma vez e qual se repete?","Precisamos comparar valores em uma mesma data.","cards"],["Como trazer para a mesma data?","O desconto torna valores comparáveis na data-base.",["VP_t = C_t / (1 + r)^t","Comparar na mesma data."],"Explique taxa e período. Desconto não reduz fisicamente um custo: muda sua expressão econômica. A taxa deve seguir os critérios da organização. Os 8% do caso são didáticos.","Um custo distante tem o mesmo valor presente de um custo hoje?","A taxa precisa combinar com a forma dos valores.","formula"],["Taxa real ou nominal?","Inflação e desconto precisam ser consistentes.",["Valores constantes → taxa real","Valores nominais → taxa nominal"],"O caso usa reais constantes e taxa real. Relação: (1+r_nominal)=(1+r_real)×(1+inflação). Não aplique inflação geral para depois descontar com taxa real. Variações reais de preços são distintas da inflação geral.","O que acontece se misturarmos as duas bases?","Agora podemos consolidar o LCC.","cards"],["Como o LCC é formado?","Somar valores presentes das parcelas relevantes.",["Investimento inicial","Custos futuros descontados","Menos créditos descontados"],"Use a fórmula completa nos materiais. Intervenção e residual entram uma única vez. Se o fluxo anual já incorpora esses eventos, não acrescente novamente suas parcelas.","O valor residual entra com qual sinal?","Para custos anuais iguais, podemos simplificar.","lccformula"],["O que fazer com os custos recorrentes?","Uma série uniforme pode ser convertida por um fator.",["VP_anual = C_anual × F"],"Explique F=[1-(1+r)^(-n)]/r sem exigir memorização. Vale para valores uniformes no fim dos períodos. Se taxa zero, F=n. Se os custos variam, descontar ano a ano.","Podemos usar o mesmo fator com outro horizonte?","Vamos revelar o resultado do cenário original.","factor"],["Qual alternativa tem menor LCC?","A conclusão depende do cenário calculado.",["Comparação em valor presente"],"Revele por etapas. No original, A ≈ R$ 1.053.970 e B ≈ R$ 889.770; vantagem de B ≈ R$ 164.200. Identifique horizonte, taxa e horas. O resultado inclui perdas econômicas do escopo.","Qual parcela explica a maior parte da diferença?","Esse resultado não é equivalente a um payback.","lccresult"],["Menor LCC não é menor payback.","Indicadores respondem a perguntas diferentes.",["LCC: custo no horizonte","Payback: tempo de recuperação"],"Payback simples ignora desconto e efeitos após o retorno. Mesmo o descontado não substitui a comparação completa. Serviços ou benefícios diferentes podem exigir uma análise de valor mais ampla.","Qual decisão seria prejudicada usando apenas retorno rápido?","Agora precisamos testar a força da conclusão.","cards"],["O resultado vale sob quais condições?","A conclusão está vinculada às premissas.",["Neste horizonte","Neste regime","Com estes dados"],"Diferencie cálculo correto e decisão robusta. Fontes frágeis ou condições alteradas mudam a preferência. Desafie premissas sem alterar arbitrariamente a taxa para favorecer uma alternativa.","Qual premissa poderia inverter a escolha?","Vamos desafiar o resultado.","cards"]]},{"title":"Como avaliar as incertezas?","minutes":25,"times":[3,3,3,4,3,3,3,3],"slides":[["O que pode estar errado?","Precisão aparente não elimina incerteza.",["Uso","Energia","Falhas","Custos futuros"],"Peça as maiores dúvidas. Muitos decimais não significam confiabilidade. Não invente distribuições ou probabilidades. Identifique o que sabemos e o que estimamos.","Qual número vocês verificariam primeiro?","Vamos variar uma premissa de cada vez.","cards"],["O que mais influencia a escolha?","Compare a influência sobre a diferença de LCC, não apenas o tamanho do custo.",["Impacto por variável","Limite de inversão"],"Tela visual. O tornado varia uma entrada por vez em ±20% por padrão, mantendo as demais. O controle permite 10% a 50%; o uso é limitado a 8.760 h/ano. Manutenção planejada varia as rotinas e a intervenção prevista, nas duas alternativas. MTBF e reparo também variam nas duas bombas. As faixas são didáticas, não intervalos de confiança. A curva permite escolher tarifa ou horas. Δ = LCC A − LCC B: positivo favorece B, negativo favorece A. Não force cruzamento: no caso original, a tarifa não inverte a escolha em valores não negativos, embora tenha impacto relevante. O regime de uso pode inverter a escolha. Os controles desta tela não alteram o cenário principal.","Qual variável merece ser confirmada antes da aprovação?","Vamos conferir os números e combinar premissas.","sensitivityVisual"],["Quais cenários mudam a decisão?","A recomendação precisa resistir a condições plausíveis.",["Premissas explícitas","Resultados comparáveis"],"Tela analítica. Use a tabela de testes isolados para ler a faixa e os valores de Δ; use a tabela de cenários para combinações de tarifa e horas. As variações são exemplos didáticos, sem probabilidades atribuídas. Energia, falhas, reparos e perdas acompanham as horas efetivas. A planejada por calendário e a operação fixa permanecem. A tabela distingue impacto no custo de mudança de preferência. O cenário de uso reduzido adota 5% das horas-base e pode inverter a escolha. Explique por que cada cenário seria plausível na aplicação real. Os cenários usam as entradas atuais do simulador.","A escolha muda em uma condição plausível para a operação?","Vamos aprofundar a influência das horas de operação.","sensitivityAnalytic"],["A escolha depende do uso?","O valor da eficiência depende da utilização.",["Mais horas: maior exposição aos custos de uso.","Menos horas: maior peso relativo do investimento."],"Compare 3.000 e 6.000 h com as demais premissas iguais. Não revele ainda o exercício de 300 h. Baixo uso não favorece automaticamente A: o resultado depende de todos os custos.","Qual informação operacional precisa ser confirmada antes da compra?","E se a consequência da parada for diferente?","hourscompare"],["E se a produção não for perdida?","A consequência depende da configuração.",["Perda não recuperável","Produção recuperável","Sistema com reserva"],"Demonstre perda produtiva nula, mantendo reparos. Isso não modela automaticamente uma reserva. Redundância exige incluir investimento, uso e cobertura dos eventos.","Que evidência sustenta a consequência adotada?","Existe um ponto em que a preferência muda?","noloss"],["Onde a decisão se inverte?","O ponto de indiferença identifica uma condição crítica.",["LCC_A = LCC_B","Onde a escolha muda?"],"Apresente a ideia de zerar a diferença. Não revele o limite numérico do caso. O cruzamento depende das premissas e da faixa fisicamente possível.","A operação real está perto ou longe desse limite?","Isso ajuda a decidir onde buscar informação.","formula"],["Qual dado vale a pena melhorar?","Priorizar alta influência e baixa confiança.",["Impacto na decisão","Confiança no dado"],"Exemplos: medir potência, confirmar horas, revisar histórico. Não dedique o mesmo esforço a todas as entradas. Uma informação incerta pode ter pouca influência; outra pode ser decisiva.","Qual medição reduziria mais nossa dúvida?","Uma conclusão pode exigir condições adicionais.","cards"],["Decisão robusta ou condicional?","A recomendação deve informar seus limites.",["Escolher","Validar antes","Reavaliar se mudar"],"Uma recomendação pode ser condicionada à confirmação de dados. Defina responsável, prazo e gatilho. Não transforme ausência de evidência em certeza nem use o modelo só para justificar uma decisão prévia.","O que precisaríamos confirmar para aprovar?","Agora a turma vai decidir em outro regime de uso.","cards"]]},{"title":"Aplicação prática: qual alternativa escolher?","minutes":35,"times":[3,3,7,7,4,4,4,3],"slides":[["A necessidade mudou.","Uma mudança operacional exige reavaliação.",["Mesmas bombas.","Agora: 300 h/ano.","A escolha continua a mesma?"],"Apresente o novo regime. São as mesmas propostas sob outra aplicação. Os demais dados permanecem. Não mostre o gabarito. Peça uma previsão e registre o raciocínio.","Qual alternativa vocês esperam que seja favorecida?","Vamos esclarecer as regras do exer function model(p,side,hours=p.hours){
 const s=p[side],n=p.years,r=p.rate/100;
 const factor=r===0?n:-Math.expm1(-n*Math.log1p(r))/r;
 const initial=s.purchase+s.engineering+s.logistics+s.installation+s.commissioning;
 const energy=s.power*hours*p.tariff,failures=hours/s.mtbf,corrective=failures*s.repair;
 const downHours=failures*s.downtime,loss=downHours*p.loss;
 const directAnnual=energy+s.operation+s.planned+corrective,annual=directAnnual+loss;
 const renewalPV=p.renewalYear<=n?s.renewal/Math.pow(1+r,p.renewalYear):0;
 const terminalPV=(s.disposal-s.residual)/Math.pow(1+r,n);
 const directLCC=initial+directAnnual*factor+renewalPV+terminalPV,lossPV=loss*factor,lcc=directLCC+lossPV;
 const flow=[{year:0,initial,energy:0,operation:0,planned:0,corrective:0,loss:0,renewal:0,disposal:0,residual:0,total:initial,pv:initial}];
 for(let year=1;year<=n;year++){
  const renewal=year===p.renewalYear?s.renewal:0,disposal=year===n?s.disposal:0,residual=year===n?s.residual:0,total=annual+renewal+disposal-residual;
  flow.push({year,initial:0,energy,operation:s.operation,planned:s.planned,corrective,loss,renewal,disposal,residual,total,pv:total/Math.pow(1+r,year)});
 }
 return {initial,energy,failures,corrective,downHours,loss,directAnnual,annual,factor,renewalPV,terminalPV,directLCC,lossPV,lcc,cae:lcc/factor,flow};
}

 const path=k=>f.points.map((p,i)=>(i?'L':'M')+x(p.x)+','+y(p[k])).join(' ');
 let axes='';for(let i=0;i<=4;i++){const v=min+span*i/4;axes+='<line x1="86" y1="'+y(v)+'" x2="651" y2="'+y(v)+'" stroke="#e1e4e8"/><text x="75" y="'+(y(v)+5)+'" text-anchor="end" font-size="13">'+num(v/1000,1)+'</text>';const t=f.max*i/4;axes+='<text x="'+x(t)+'" y="288" text-anchor="middle" font-size="13">'+num(t,f.key==='hours'?0:2)+'</text>';}
 const inRange=f.root!==null&&f.root>=0&&f.root<=f.max;
 let marker=inRange?'<line x1="'+x(f.root)+'" y1="30" x2="'+x(f.root)+'" y2="264" stroke="#b63d3d" stroke-dasharray="5 4"/>':'';
 marker+='<line x1="'+x(state.params[f.key])+'" y1="30" x2="'+x(state.params[f.key])+'" y2="264" stroke="#a0a7b0" stroke-dasharray="2 5"/>';
 const unit=f.key==='hours'?'h/ano':'R$/kWh';
 const message=inRange?'Empate em '+num(f.root,f.key==='hours'?0:3)+' '+unit+'. A preferência muda nesse limite.':f.root!==null&&f.root>=0?'Empate fora da faixa exibida: '+num(f.root,3)+' '+unit+'.':'Sem inversão para valores não negativos, nas premissas atuais.';
 return '<svg viewBox="0 0 720 330" role="img" aria-label="Curvas de LCC das bombas A e B"><text x="10" y="18" font-size="13">LCC · R$ mil (VP)</text>'+axes+marker+'<path d="'+path('a')+'" fill="none" stroke="#14171c" stroke-width="3"/><path d="'+path('b')+'" fill="none" stroke="#14171c" stroke-width="3" stroke-dasharray="8 5"/><text x="370" y="321" text-anchor="middle" font-size="14">'+(f.key==='hours'?'Horas efetivas anuais':'Tarifa de energia · R$/kWh')+'</text></svg><div class="legend"><span>━ A</span><span>┄ B</span><span>Tracejado vertical: base / limite</span></div><p class="micro curve-verdict">'+message+'</p>';
}

function sensitivityAnalytic(){
 const p=state.params,rows=sensitivityData(),base=comparison();
 function value(d,q){if(['planned','mtbf','repair'].includes(d.key))return num(q===d.lo?1-sensSpread/100:1+sensSpread/100,2)+'×';return d.key==='tariff'?money(q[d.key],2):num(q[d.key],2);}
 const tests=rows.map(d=>[esc(d.name),value(d,d.lo)+' → '+value(d,d.hi)+' '+esc(d.unit),signed(d.a)+' / '+signed(d.b),money(d.impact),winner(d.a)===winner(d.b)?'Mantém '+winner(d.a):'Muda '+winner(d.a)+' → '+winner(d.b)]);
 const scenarios=[['Base',1,1],['Menor tarifa',1,.8],['Maior tarifa',1,1.2],['Uso e tarifa maiores',1.2,1.2],['Uso e tarifa menores',.8,.8],['Uso reduzido',.05,1]];
 const matrix=scenarios.map(([label,h,t])=>{const q=clone(p);q.hours=Math.min(8760,p.hours*h);q.tariff=p.tariff*t;const c=compareParams(q);return [label,num(q.hours,0)+' h · '+money(q.tariff,2)+'/kWh',money(c.A.lcc),money(c.B.lcc),signed(c.delta),'<b class="winner">'+winner(c.delta)+'</b>'];});
 return '<div class="metric-strip"><div><small>LCC A · base</small><b>'+money(base.A.lcc)+'</b></div><div><small>LCC B · base</small><b>'+money(base.B.lcc)+'</b></div><div><small>Vantagem de '+winner(base.delta)+'</small><b>'+money(Math.abs(base.delta))+'</b></div></div><details class="analysis-detail"><summary>Testes isolados · ±'+sensSpread+'% · abrir memória de sensibilidade</summary>'+table(['Variável','Faixa testada','Δ menor / maior entrada','Maior efeito vs. base','Preferência'],tests)+'<p class="micro">Fatores relativos à base aplicados às duas bombas. Planejada inclui rotinas e intervenção prevista. Faixas didáticas; validar plausibilidade e dependências.</p></details><h2>Cenários combinados</h2>'+table(['Cenário','Uso e tarifa','LCC A','LCC B','Δ = A − B','Menor LCC'],matrix)+'<p class="micro">Valores em VP · '+esc(caseLabel())+'. Apenas uso e tarifa mudam nos cenários; demais entradas mantidas. Horas alteram energia, falhas, corretivas e perdas. Planejada por calendário permanece. Exemplos didáticos, sem probabilidade atribuída.</p><button class="btn" data-action="simulator">Editar premissas e recalcular</button>';

function lastStep(){return Math.max(0,...Array.from($("stage").querySelectorAll("[data-step]")).map(el=>Number(el.dataset.step)))}
function updateStep(){
 $("stage").querySelectorAll("[data-step]").forEach(el=>{const hide=Number(el.dataset.step)>step;el.classList.toggle("pending",hide);el.setAttribute("aria-hidden",String(hide))});
 $("prevButton").disabled=current===0&&step===0;
 $("nextButton").disabled=current===63&&step===lastStep();
 $("status").textContent=slides[current].id+" · "+(step+1)+"/"+(lastStep()+1);
 $("nextButton").setAttribute("aria-label",step<lastStep()?"Revelar próxima informação":"Próximo slide");
}
function render(index,atEnd=false,keepStep=null){
 current=Math.max(0,Math.min(63,index));state.current=current;
 const s=slides[current];
 $("topicName").textContent=(s.topic+1)+"/8 · "+topics[s.topic].title;
 $("position").textContent=(current+1)+" de 64 slides";
 $("stage").innerHTML='<article class="slide" aria-labelledby="slideTitle"><p class="kicker">'+s.id+' · '+s.minutes+' min'+(changed()?' · cenário editado':'')+'</p><h1 id="slideTitle" tabindex="-1">'+highlightTitle(s.title)+'</h1>'+bodyFor(s)+'</article>';
 document.body.dataset.kind=s.kind;
 document.documentElement.style.setProperty("--course-progress",((current+1)/slides.length*100)+"%");
 $("topicRail").innerHTML=topics.map((t,i)=>'<button title="'+esc(t.title)+'" data-go="'+(i*8)+'" aria-label="Tópico '+(i+1)+': '+esc(t.title)+'" '+(i===s.topic?'aria-current="step"':'')+'><span>'+String(i+1).padStart(2,"0")+'</span></button>').join("");
 step=keepStep!==null?Math.min(keepStep,lastStep()):atEnd?lastStep():0;
 updateStep();document.title="LCC · "+s.id+" · "+s.title;
 if(s.kind==="sensitivity")updateSensitivity();
 save();
}
function advance(){if(step<lastStep()){step++;updateStep()}else if(current<63){render(current+1);window.scrollTo(0,0)}}
function back(){if(step>0){step--;updateStep()}else if(current>0){render(current-1,true);window.scrollTo(0,0)}}
function updateSensitivity(){
 if(!$("sensResult"))return;
 const c=comparison(state.sensitivityHours);
 $("sensHours").textContent=num(state.sensitivityHours,0)+" h/ano";
 $("sensResult").innerHTML=results(money(c.A.lcc),money(c.B.lcc),"LCC")+'<p class="statement">'+esc(conclusion(c.delta))+'</p>';
}

  const next={params:clone(data.params),fields:{},checklist:{},audit:{},current,sensitivityHours:6000};
  if(data.fields&&typeof data.fields==="object")for(const [k,v] of Object.entries(data.fields)){
   if(/^[a-zA-Z0-9_]+$/.test(k)&&!["__proto__","prototype","constructor"].includes(k)&&typeof v==="string")next.fields[k]=v;
  }
  for(let i=1;i<=34;i++){
   const v=data.checklist?.[i];
   if(v&&typeof v==="object")next.checklist[i]={
    status:["Pendente","Concluído","Não aplicável"].includes(v.status)?v.status:"Pendente",
    evidence:typeof v.evidence==="string"?v.evidence:""
   };
  }
  for(let i=1;i<=12;i++){
   const v=data.audit?.[i];
   if(v&&typeof v==="object"){
    next.audit[i]={score:["1","2","3","4","5","NA"].includes(v.score)?v.score:""};
    for(const k of ["evidence","gap","action","owner"])next.audit[i][k]=typeof v[k]==="string"?v[k]:"";
   }
  }
  state=next;save();materials(activeMaterial);
 }catch(e){alert("Não foi possível importar: "+e.message)}
}
function printPanel(){
 const src=$("materialContent")||$("panelBody"),copy=src.cloneNode(true);
 copy.querySelectorAll("input,textarea,select").forEach(el=>{
  const span=document.createElement("span");
  span.textContent=el.tagName==="SELECT"?el.options[el.selectedIndex]?.text||"":el.value||"________________";
  span.style.whiteSpace="pre-wrap";el.replaceWith(span);
 });
 copy.querySelectorAll("button,.material-nav").forEach(el=>el.remove());
 const w=window.open("","_blank");
 if(!w){alert("Permita a janela de impressão neste navegador.");return}
 w.document.open();
 w.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>LCC — Material de apoio</title><style>body{font:12pt Arial;color:#000;background:#fff;margin:20mm}h1,h2,h3{break-after:avoid}table{border-collapse:collapse;width:100%;font-size:10pt}th,td{border-bottom:1px solid #000;padding:7px;text-align:left;vertical-align:top}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;margin:12px 0}label span{display:block;margin-top:6px}.audit-item,.check-group{margin:20px 0;border-top:1px solid #000;padding-top:10px}.check-row{padding:12px 0;border-bottom:1px solid #000}.check-row span{display:block;margin:6px 0}p,li{line-height:1.45}.notice{border-left:2px solid #000;padding-left:12px}a{color:#000}</style></head><body><h1>LCC — '+esc(materialOptions.find(x=>x[0]===activeMaterial)?.[1]||"Material de apoio")+'</h1>'+copy.innerHTML+'</body></html>');
 w.document.close();w.focus();setTimeout(()=>w.print(),300);
}
let breakSeconds=600,breakEnd=null,breakTimer=null;
function remaining(){return breakEnd===null?breakSeconds:Math.max(0,Math.ceil((breakEnd-Date.now())/1000))}
function updateBreak(){
 const sec=remaining();if($("breakClock"))$("breakClock").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
 if(breakEnd!==null&&sec===0){breakEnd=null;breakSeconds=0;clearInterval(breakTimer);breakTimer=null;if($("breakMessage"))$("breakMessage").textContent="Intervalo concluído."}
}
function openBreak(){
 openPanel("Intervalo · 10 minutos",'<p id="breakClock" class="price">10:00</p><p id="breakMessage">O cronômetro começa ao clicar em Iniciar.</p><div class="actions"><button class="btn" data-action="breakStart">Iniciar / continuar</button><button class="btn" data-action="breakPause">Pausar</button><button class="btn" data-action="breakReset">Reiniciar</button></div>',"break");updateBreak();
}
$("nextButton").onclick=advance;$("prevButton").onclick=back;$("indexButton").onclick=openIndex;
$("notesButton").onclick=openNotes;$("materialsButton").onclick=()=>materials();$("closePanel").onclick=closePanel;$("printButton").onclick=printPanel;
$("panel").addEventListener("close",()=>{document.body.classList.remove("locked");render(current,false,step)});
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.altKey||e.metaKey||$("panel").open||e.target.closest("input,textarea,select"))return;
 if(e.key===" "&&e.target.closest("button"))return;
 if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();advance()}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();back()}
 else if(e.key==="Home"){e.preventDefault();render(0)}
 else if(e.key==="End"){e.preventDefault();render(63,true)}
 else if(e.key.toLowerCase()==="n"){e.preventDefault();openNotes()}
 else if(e.key.toLowerCase()==="m"){e.preventDefault();materials()}
});
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.field){state.fields[el.dataset.field]=el.value;save()}
 if(el.dataset.check){const id=el.dataset.check;state.checklist[id]||={};state.checklist[id][el.dataset.key]=el.value;save()}
 if(el.dataset.audit){const id=el.dataset.audit;state.audit[id]||={};state.audit[id][el.dataset.key]=el.value;save();if($("auditSummary"))$("auditSummary").textContent=auditSummary()}
 if(el.id==="sensSpread"){sensSpread=Number(el.value);$("sensitivityBody").innerHTML=sensitivityVisualBody();$("spreadValue").textContent="±"+sensSpread+"%";}
 if(el.id==="sensRange"){state.sensitivityHours=Number(el.value);updateSensitivity();save()}
});
document.addEventListener("change",e=>{
 if(e.target.id==="curveVariable"){curveVariable=e.target.value;$("sensitivityBody").innerHTML=sensitivityVisualBody();}
 if(e.target.id==="materialSelect")materials(e.target.value);
 if(e.target.id==="importFile")importJSON(e.target.files[0]);
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="modelForm")return;e.preventDefault();
 const form=e.target;if(!form.reportValidity())return;
 const candidate=clone(state.params);
 for(const [name,value] of new FormData(form)){
  const n=Number(value);
  if(name.includes(".")){const [side,key]=name.split(".");candidate[side][key]=n}else candidate[name]=n;
 }
 if(!validParams(candidate)){$("modelError").textContent="Verifique as entradas. MTBF deve ser positivo. Horizonte e ano da intervenção devem ser inteiros; demais valores devem ser válidos e não negativos.";return}
 const trialA=model(candidate,"A"),trialB=model(candidate,"B");
 if(!Number.isFinite(trialA.lcc)||!Number.isFinite(trialB.lcc)){$("modelError").textContent="Os valores excedem a faixa de cálculo. Revise as entradas.";return}
 state.params=candidate;save();materials("simulator");
});
document.addEventListener("click",e=>{
 const go=e.target.closest("[data-go]");
 if(go){$("panel").close();render(Number(go.dataset.go));window.scrollTo(0,0);return}
 const b=e.target.closest("[data-action]");if(!b)return;
 switch(b.dataset.action){
 case "simulator":materials("simulator");break;
 case "export":exportJSON();break;
 case "csv":exportCSV();break;
 case "import":$("importFile").click();break;
 case "exercise":materials("exercise");break;
 case "audit":materials("audit");break;
 case "checklist":materials("checklist");break;
 case "restore":state.params=clone(DEFAULTS);state.sensitivityHours=6000;save();materials("simulator");break;
 case "break":openBreak();break;
 case "breakStart":if(breakEnd===null){if(breakSeconds<=0)breakSeconds=600;breakEnd=Date.now()+breakSeconds*1000;clearInterval(breakTimer);breakTimer=setInterval(updateBreak,250);if($("breakMessage"))$("breakMessage").textContent="Intervalo em andamento.";updateBreak()}break;
 case "breakPause":breakSeconds=remaining();breakEnd=null;clearInterval(breakTimer);breakTimer=null;updateBreak();if($("breakMessage"))$("breakMessage").textContent="Pausado.";break;
 case "breakReset":breakSeconds=600;breakEnd=null;clearInterval(breakTimer);breakTimer=null;updateBreak();if($("breakMessage"))$("breakMessage").textContent="Pronto para iniciar.";break;
 }
});
$("fullButton").hidden=!document.fullscreenEnabled;
$("fullButton").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$("fullButton").textContent="Tela cheia indisponível"}};
document.addEventListener("fullscreenchange",()=>{$("fullButton").textContent=document.fullscreenElement?"Sair da tela cheia":"Tela cheia"});
render(current);


</script>
</body>
</html>
