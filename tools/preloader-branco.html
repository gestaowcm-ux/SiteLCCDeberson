<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preloader Giratório (Fundo Branco) — Mentoria de Confiabilidade</title>
  <meta name="description" content="Demonstração do preloader de anel tipográfico circular com rotação contínua em fundo branco.">
  <link rel="stylesheet" href="./style.css">
  
  <style>
    /* Estilos Customizados para o Preloader Giratório - Tema Claro (Fundo Branco) */
    
    body {
      background-color: #ffffff;
      color: #000000;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Overlay do Preloader */
    .preloader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Contêiner Principal do Movimento */
    .preloader-wrapper {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Rotação Infinita do Anel Tipográfico */
    .text-ring-container {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotate-clockwise 18s linear infinite;
      will-change: transform;
    }

    @keyframes rotate-clockwise {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .ring-svg {
      width: 100%;
      height: 100%;
    }

    .ring-svg text {
      font-family: 'Inter', 'Courier New', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3.5px;
      fill: #000000; /* Texto preto para alto contraste no fundo branco */
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Painel Central Estático (Logo e Indicador de Progresso) */
    .center-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 185px;
      height: 185px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95); /* Fundo branco semitransparente */
      border: 1px solid rgba(0, 0, 0, 0.08); /* Borda escura sutil */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Sombra suave */
      z-index: 10;
    }

    /* Logotipo da Confiabilidade (Engrenagem Geométrica Interativa) */
    .center-logo-svg {
      width: 58px;
      height: 58px;
      fill: #000000; /* Ícone preto */
      margin-bottom: 10px;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .preloader-wrapper:hover .center-logo-svg {
      transform: scale(1.12) rotate(45deg);
    }

    /* Contador Numérico de Carregamento */
    .counter-display {
      font-size: 22px;
      font-weight: 600;
      color: var(--color-success, #059669); /* Tom verde brilhante operacional */
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    .counter-display.loaded {
      color: #000000;
    }



    /* Classe Utilitária para Acessibilidade */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .preloader-wrapper {
        width: 300px;
        height: 300px;
      }
      .center-content {
        width: 140px;
        height: 140px;
      }
      .ring-svg text {
        font-size: 10.5px;
        letter-spacing: 2.8px;
      }
    }
  </style>
</head>
<body>

  <h1 class="sr-only">Preloader Giratório Claro — Mentoria de Confiabilidade</h1>

  <!-- Overlay do Preloader -->
  <div class="preloader-overlay" id="preloaderOverlay">
    <div class="preloader-wrapper">
      
      <!-- Elemento Circular com Rotação Infinita -->
      <div class="text-ring-container">
        <svg viewBox="0 0 200 200" class="ring-svg">
          <!-- Caminho circular invisível com raio 80, centralizado no ponto (100, 100) -->
          <path id="ringPath" d="M 100, 100 m -80, 0 a 80,80 0 1,1 160,0 a 80,80 0 1,1 -160,0" fill="none" />
          <text xml:space="preserve"><textPath href="#ringPath" startOffset="0%">•   CONFIABILIDADE   •   MENTORIA PRÁTICA   •   DEBERSON LUIS   </textPath></text>
        </svg>
      </div>
      
      <!-- Miolo Estático da Marca -->
      <div class="center-content">
        <!-- Ícone Vetorial de Engrenagem -->
        <svg class="center-logo-svg" viewBox="0 0 24 24">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
        </svg>
        <!-- Contador de Porcentagem Dinâmico -->
        <span class="counter-display" id="loaderCounter">0%</span>
      </div>
    </div>
    

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const counter = document.getElementById('loaderCounter');
      let progress = 0;
      let intervalId = null;

      // Executa o carregamento simulado
      function initLoader() {
        // Redefine estados
        progress = 0;
        counter.textContent = '0%';
        counter.classList.remove('loaded');
        
        // Simulação com incrementos irregulares para parecer orgânico
        intervalId = setInterval(() => {
          progress += Math.floor(Math.random() * 4) + 1; // Incrementos aleatórios entre 1% e 4%
          
          if (progress >= 100) {
            progress = 100;
            clearInterval(intervalId);
            counter.textContent = '100%';
            counter.classList.add('loaded');
            
            // Redireciona automaticamente para o index.html após 2 segundos de satisfação visual
            setTimeout(() => {
              window.location.href = './index.html';
            }, 2000);
          } else {
            counter.textContent = `${progress}%`;
          }
        }, 22);
      }

      // Dispara o preloader no carregamento inicial da página
      initLoader();
    });
  </script>
<script type="module" src="/js/laser-pointer.js"></script>
</body>
</html>
